services:
  envoy:
    image: envoyproxy/envoy:v1.32.13
    command: ["/usr/local/bin/envoy", "-c", "/etc/envoy/envoy.yaml", "-l", "info"]
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "8080:10000"
      - "9901:9901"
    depends_on:
      - app1
      - app2
    networks: [lab]

  app1:
    image: hashicorp/http-echo:1.0
    command: ["-listen=:8080", "-text=Hello from APP-1"]
    expose: ["8080"]
    networks: [lab]

  app2:
    image: hashicorp/http-echo:1.0
    command: ["-listen=:8080", "-text=Hello from APP-2"]
    expose: ["8080"]
    networks: [lab]

networks:
  lab:
    driver: bridge
