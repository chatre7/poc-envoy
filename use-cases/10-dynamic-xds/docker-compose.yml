services:
  envoy:
    image: envoyproxy/envoy:v1.32.13
    command: ["/usr/local/bin/envoy", "-c", "/etc/envoy/envoy.yaml", "-l", "info"]
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml:ro
      # Writable so the cross-platform smoke test can perform an atomic rename
      # inside Linux, ensuring Envoy receives the filesystem notification.
      - ./xds:/etc/envoy/xds
    ports: ["8080:10000", "9901:9901"]
    depends_on: [backend-v1, backend-v2]
    networks: [lab]
  backend-v1:
    image: hashicorp/http-echo:1.0
    command: ["-listen=:8080", "-text=VERSION-1"]
    expose: ["8080"]
    networks: [lab]
  backend-v2:
    image: hashicorp/http-echo:1.0
    command: ["-listen=:8080", "-text=VERSION-2"]
    expose: ["8080"]
    networks: [lab]
networks:
  lab: { driver: bridge }
