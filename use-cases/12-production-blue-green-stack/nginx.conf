events {}

http {
    server_tokens off;

    map $http_x_request_id $correlation_id {
        default $http_x_request_id;
        "" $request_id;
    }

    log_format gateway_json escape=json '{"timestamp":"$time_iso8601","request_id":"$correlation_id","method":"$request_method","uri":"$request_uri","status":$status,"duration":$request_time,"upstream":"$upstream_addr","upstream_status":"$upstream_status"}';
    access_log /dev/stdout gateway_json;

    upstream envoy_upstream {
        server envoy:10000;
        keepalive 32;
    }

    upstream deployment_ui {
        server deployment-ui:8000;
        keepalive 8;
    }

    server {
        listen 80;
        client_max_body_size 8k;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ready\n";
        }

        location = /deployment {
            return 308 /deployment/;
        }

        # Alertmanager reaches this receiver over the private Compose network.
        # Do not expose notification injection through the operator gateway.
        location = /deployment/api/alerts {
            return 404;
        }

        location /deployment/ {
            proxy_pass http://deployment_ui/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $correlation_id;
            proxy_connect_timeout 2s;
            proxy_read_timeout 20s;
            proxy_next_upstream off;
        }

        location / {
            proxy_pass http://envoy_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $correlation_id;
            proxy_connect_timeout 2s;
            proxy_read_timeout 8s;
            proxy_next_upstream off;
        }
    }
}
