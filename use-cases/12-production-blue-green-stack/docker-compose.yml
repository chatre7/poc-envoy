services:
  nginx:
    image: nginx:1.27.2-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      envoy:
        condition: service_started
      deployment-ui:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 2s
      retries: 12
    restart: unless-stopped
    networks: [lab]

  envoy:
    image: envoyproxy/envoy:v1.32.13
    command: ["/usr/local/bin/envoy", "-c", "/etc/envoy/envoy.yaml", "-l", "info"]
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./xds:/etc/envoy/xds
    expose: ["10000"]
    ports:
      - "127.0.0.1:9901:9901"
    depends_on: [backend-v1, backend-v2, jaeger]
    restart: unless-stopped
    networks: [lab]

  deployment-ui:
    image: python:3.12.7-alpine
    command: ["python", "/app/server.py"]
    environment:
      ENVOY_ADMIN_URL: http://envoy:9901
      XDS_DIR: /etc/envoy/xds
      BLUE_HEALTH_URL: http://backend-v1:8080/
      GREEN_HEALTH_URL: http://backend-v2:8080/
      ALERTMANAGER_HEALTH_URL: http://alertmanager:9093/-/ready
    volumes:
      - ./deployment-ui:/app:ro
      - ./xds:/etc/envoy/xds
    expose: ["8000"]
    depends_on: [envoy, backend-v1, backend-v2]
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks: [lab]

  backend-v1:
    image: hashicorp/http-echo:1.0
    command: ["-listen=:8080", "-text=VERSION-1"]
    expose: ["8080"]
    restart: unless-stopped
    networks: [lab]

  backend-v2:
    image: hashicorp/http-echo:1.0
    command: ["-listen=:8080", "-text=VERSION-2"]
    expose: ["8080"]
    restart: unless-stopped
    networks: [lab]

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/failover-alerts.yml:/etc/prometheus/failover-alerts.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on: [envoy, deployment-ui, alertmanager]
    restart: unless-stopped
    networks: [lab]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:9093:9093"
    depends_on: [deployment-ui]
    restart: unless-stopped
    networks: [lab]

  grafana:
    image: grafana/grafana:11.2.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus]
    restart: unless-stopped
    networks: [lab]

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_ZIPKIN_HOST_PORT: ":9411"
    expose: ["9411"]
    ports:
      - "127.0.0.1:16686:16686"
    restart: unless-stopped
    networks: [lab]

networks:
  lab: { driver: bridge }
