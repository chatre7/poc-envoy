services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - envoy
    networks:
      - appnet

  envoy:
    image: envoyproxy/envoy:v1.32-latest
    command: ["/usr/local/bin/envoy", "-c", "/etc/envoy/envoy.yaml", "-l", "info"]
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "9901:9901"
    depends_on:
      - app1
      - app2
    networks:
      - appnet

  app1:
    image: hashicorp/http-echo:1.0
    command:
      - "-listen=:8080"
      - "-text=Hello from APP-1"
    expose:
      - "8080"
    networks:
      - appnet

  app2:
    image: hashicorp/http-echo:1.0
    command:
      - "-listen=:8080"
      - "-text=Hello from APP-2"
    expose:
      - "8080"
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
